name: Test

on: [ workflow_call, workflow_dispatch ]

jobs:
    test:
        name: Test (${{ matrix.framework }})
        strategy:
            fail-fast: false
            matrix:
                framework: [ net10.0, net11.0 ]
        runs-on: ubuntu-latest
        env:
            NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   uses: ./.github/actions/setup-dotnet-environment
            -   name: Restore dependencies
                run: dotnet restore ./tests/AustinS.TailwindCssTool.Tests.Unit
            -   name: Test
                run: dotnet test --no-restore --framework ${{ matrix.framework }} -c Release --results-directory ./test-results -- --report-xunit-ctrf
            -   if: always()
                name: Publish test report
                uses: ctrf-io/github-test-reporter@c2e2997afb89a9a515d83121ce7499e272630446 # v1.4.0
                with:
                    report-path: ./test-results/*.ctrf
                    summary-report: true
                    file-report: true
                    failed-folded-report: true
                    skipped-report: true
